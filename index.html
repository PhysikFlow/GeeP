<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- viewport-fit=cover: sem isto env(safe-area-inset-*) vale 0 no celular. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d12" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GeeP" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="description" content="Carteiras públicas de BTC, ETH e SOL, preço médio e indicadores de mercado num lugar só." />
    <title>GeeP — Portfólio cripto</title>
    <!-- A abertura fica aqui para valer desde o primeiro quadro: até o JS
         chegar, a tela seria branca. -->
    <style>
      html, body { margin: 0; background: #0b0d12; color-scheme: dark; }
      .boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 14px;
        background: #0b0d12;
        color: #eef1f6;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .boot img { width: 56px; height: 56px; }
      .boot span { font-size: 15px; font-weight: 700; letter-spacing: .02em; opacity: .92; }
      .boot i {
        width: 120px;
        height: 3px;
        border-radius: 99px;
        background: linear-gradient(90deg, transparent, #f08a24, transparent);
        background-size: 200% 100%;
        animation: boot 1.2s linear infinite;
      }
      @keyframes boot { from { background-position: 100% 0; } to { background-position: -100% 0; } }
      @media (prefers-reduced-motion: reduce) { .boot i { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Carregando o GeeP">
        <img src="/icons/icon-192.png" alt="" width="56" height="56" />
        <span>GeeP</span>
        <i></i>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
